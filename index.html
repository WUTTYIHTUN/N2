<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N2ナビ</title>
<style>
:root{--bg:#f4f6fa;--c:#fff;--t:#1f2937;--m:#6b7280;--b:#e5e7eb;--p:#2b5fd9;--pl:#e8effd;--a:#e5484d;--g:#16a34a;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--c:#1a2132;--t:#e8ecf4;--m:#97a1b5;--b:#2a3349;--p:#6d9bff;--pl:#22304f;--a:#ff7b80}}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',sans-serif,'Padauk','Noto Sans Myanmar';-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#rail{position:fixed;z-index:5;display:flex;background:var(--c);border-top:1px solid var(--b);left:0;right:0;bottom:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#rail .logo{display:none}
#rail button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.7rem;color:var(--m);border-radius:10px}
#rail button span{font-size:1.4rem}#rail button.on{color:var(--p);background:var(--pl);font-weight:700}
#app{padding-bottom:84px}
.top{position:sticky;top:0;z-index:4;background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px}
.top h1{font-size:1.3rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.top h1 small{font-size:.8rem;color:var(--m);font-weight:400}
.top input{width:100%;padding:12px 16px;font-size:1rem;border:1px solid var(--b);border-radius:999px;background:var(--c);color:var(--t);outline:none}
.top input:focus{border-color:var(--p)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex:none;padding:6px 14px;border-radius:999px;background:var(--c);border:1px solid var(--b);font-size:.85rem;color:var(--m)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.body{padding:8px 16px 16px;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:14px;position:relative}
.no{font-size:.72rem;font-weight:700;color:var(--p);background:var(--pl);border-radius:99px;padding:2px 9px}
.star{position:absolute;top:8px;right:8px;font-size:1.25rem;color:var(--b);padding:2px 6px}.star.on{color:#f5a623}
.big{font-size:1.15rem;font-weight:700;margin:10px 0 4px;padding-right:26px}
.sub{font-size:.82rem;color:var(--m);margin-top:2px}
.mm{background:var(--pl);border-radius:10px;padding:8px 10px;margin-top:10px;line-height:1.5;font-size:.95rem}
.kc{font-size:2.6rem;font-weight:700;color:var(--a);line-height:1.1;margin-top:8px}
.kr{display:flex;gap:10px;align-items:center;margin-top:6px}.kr div{font-size:.88rem;line-height:1.5}
.pend{color:var(--m)}
h2.gh{font-size:1rem;margin:20px 0 10px;color:var(--p)}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card h4{font-size:.8rem;color:var(--m);margin-bottom:6px}
.w{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--b)}.w:last-child{border:0}
.w b{flex:1}.w i{font-style:normal;color:var(--m);font-size:.85rem}.w .star{position:static}
.hide .w i{visibility:hidden}.hide .w.show i{visibility:visible}
.nb{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:4px 14px}
.nb h5{color:var(--a);font-size:1rem;margin-bottom:4px}.nb p{padding:3px 0;font-size:.95rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.tile{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:16px;text-align:left}
.tile span{font-size:1.8rem}.tile b{display:block;margin-top:6px}.tile small{color:var(--m)}
.hero{background:linear-gradient(135deg,#2b5fd9,#6d4bd9);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px}
.hero small{opacity:.85}.hero .kc{color:#fff;font-size:3.4rem}.hero p{opacity:.95}
.none{text-align:center;color:var(--m);padding:50px 0}
.tg{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--m);margin-top:8px}

.spk{position:absolute;top:8px;right:38px;font-size:1rem;padding:3px 6px;border-radius:8px;background:var(--pl)}
.w .spk{position:static}
.hide .w .sub{visibility:hidden}.hide .w.show .sub{visibility:visible}
.fc{background:var(--c);border:1px solid var(--b);border-radius:20px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;max-width:560px;margin:10px auto;cursor:pointer}
.fc .q{font-size:2.4rem;font-weight:700;word-break:break-all}.fc .a{font-size:1.5rem;color:var(--p);font-weight:700;line-height:1.5}.fc .hint{color:var(--m);font-size:.8rem;margin-top:14px}
.ctl{display:flex;gap:10px;justify-content:center;align-items:center;margin:12px 0}
.btn{padding:11px 20px;border-radius:12px;background:var(--p);color:#fff;font-weight:700}.btn.ghost{background:var(--pl);color:var(--p)}
.qz{max-width:560px;margin:10px auto}.qz .qq{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:22px;text-align:center;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--c);border:2px solid var(--b);border-radius:12px;padding:13px 14px;margin-bottom:8px;line-height:1.5}
.opt.ok{border-color:var(--g);background:rgba(22,163,74,.12)}.opt.ng{border-color:var(--a);background:rgba(229,72,77,.12)}
@media(min-width:800px){
#rail{top:0;bottom:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--b);padding:16px 10px;gap:4px}
#rail .logo{display:block;font-size:1.4rem;font-weight:800;color:var(--p);padding:4px 12px 16px}
#rail button{flex:none;flex-direction:row;gap:10px;font-size:.95rem;padding:11px 12px}
#app{margin-left:200px;padding-bottom:20px}.tiles{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<nav id="rail"></nav><div id="app"></div>
<script>

function filtered(){const s=SRC[st.tab],q=st.q.trim().toLowerCase();
 return s.items().filter(x=>(!st.chip||x.grp===st.chip)&&(!st.fav||fav.has(x.id))&&(!q||String(x.no)===q||x.text.toLowerCase().includes(q)))}
function list(){const items=filtered();let h='';
 if(st.tab==='vocab'){const g={};items.forEach(x=>{((g[x.grp]??={})[x.sec]??=[]).push(x)});
  h=Object.entries(g).map(([ch,ss])=>`<h2 class="gh">Chapter ${ch}</h2><div class="secs ${st.hide?'hide':''}">${Object.entries(ss).map(([n,ws])=>`<div class="card"><h4>Section ${n}</h4>${ws.map(x=>`<div class="w" data-r><b>${E(x.w[0])}${MM[x.w[0]]?`<br><small class="sub">${E(MM[x.w[0]])}</small>`:''}</b><i>${E(x.w[1])}</i>${spk(x.w[1]||x.w[0])}${star(x.id)}</div>`).join('')}</div>`).join('')}</div>`).join('')}
 else if(st.tab==='notes'){const g={};items.forEach(x=>{(g[x.grp]??=[]).push(x)});
  h=`<div class="secs ${st.hide?'hide':''}" style="grid-template-columns:repeat(auto-fill,minmax(290px,1fr))">${Object.entries(g).map(([gi,ws])=>{const H=DATA.notes[gi];return `<div class="card"><span class="no">${H.t}</span><div class="big">${E(H.h)} <small class="sub">${E(H.r)}</small></div><div class="sub">${E(H.m)}</div>${ws.map(x=>`<div class="w" data-r><b>${E(x.w[0])}${x.w[2]?`<br><small class="sub">${E(x.w[2])}</small>`:''}</b><i>${E(x.w[1])}</i>${spk(x.w[1]||x.w[0])}${star(x.id)}</div>`).join('')}</div>`}).join('')}</div>`}
 else h=`<div class="grid">${items.map(x=>`<div class="card">${x.html}</div>`).join('')}</div>`;
 $('#sub').textContent=items.length+' 件';$('#list').innerHTML=items.length?h:'<div class="none">見つかりません<br>(မတွေ့ရှိပါ)</div>'}
function screen(){
 if(st.tab==='practice')return pscreen();
 if(st.tab==='home'){const n=DATA.kanji.length,K=DATA.kanji.filter(x=>x[1]||x[5]),d=Math.floor(Date.now()/864e5)%K.length,k=K[d];
  $('#app').innerHTML=`<div class="top"><h1>N2ナビ <small>JLPT N2 学習アプリ</small></h1></div><div class="body">
  <div class="hero"><small>今日の漢字</small><div class="kc">${k[0]}</div><p>音 ${E(k[1])} ／ 訓 ${E(k[2])}</p><p>${E(k[5])} ${E(k[6])}</p></div>
  <div class="tiles">${[['gram',DATA.gram.length,'件'],['kanji',n,'字'],['vocab',DATA.vocab.reduce((a,v)=>a+v.sections.reduce((b,s)=>b+s.length,0),0),'語'],['notes',DATA.notes.reduce((a,g)=>a+g.i.length,0),'語'],['practice',7,'種類']].map(([t,c,u])=>{const x=T.find(y=>y[0]===t);return `<button class="tile" data-go="${t}"><span>${x[1]}</span><b>${x[2]}</b><small>${c} ${u}</small></button>`}).join('')}</div>
  <p class="sub" style="margin-top:16px;text-align:center">★ お気に入り: ${fav.size} 件</p></div>`;return}
 const s=SRC[st.tab],ch=s.chips();
 $('#app').innerHTML=`<div class="top"><h1>${s.title}<small id="sub"></small></h1><input id="q" placeholder="検索 (番号・漢字・読み・ミャンマー語)" value="${E(st.q)}">
 <div class="chips"><button class="chip ${st.fav?'on':''}" data-fav>★ お気に入り</button>${st.tab==='vocab'||st.tab==='notes'?`<button class="chip ${st.hide?'on':''}" data-hide>読みを隠す</button>`:''}<button class="chip ${st.chip?'':'on'}" data-chip="">全部</button>${ch.map(c=>`<button class="chip ${st.chip===c[0]?'on':''}" data-chip="${c[0]}">${c[1]}</button>`).join('')}</div></div><div class="body" id="list"></div>`;
 $('#q').oninput=e=>{st.q=e.target.value;list()};list()}
function go(t){if(!SRC[t]&&t!=='home'&&t!=='practice')t='home';st.tab=t;st.q='';st.chip='';st.fav=false;st.hide=false;location.hash=t;
 $('#rail').innerHTML='<div class="logo">N2ナビ</div>'+T.map(x=>`<button class="${x[0]===t?'on':''}" data-go="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');screen();scrollTo(0,0)}
// ---- 音声 ----
function say(t){if(!('speechSynthesis' in window))return alert('この端末は音声に対応していません');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)}
// ---- 練習(フラッシュカード・クイズ) ----
const DK=[['vr','単語→読み'],['vm','単語→ミャンマー語'],['g','文法→意味'],['k','漢字→読み'],['kw','漢字語彙→ミャンマー語'],['nr','ノート→読み'],['nm','ノート→ミャンマー語']];
const pr={deck:'vr',mode:'card',fav:false,list:[],i:0,flip:false,qz:null};
function decks(){const V=[];const N=DATA.notes.flatMap((g,gi)=>g.i.map((w,i)=>({id:`n${gi}-${i}`,w})));DATA.vocab.forEach(v=>v.sections.forEach((s,j)=>s.forEach((w,i)=>V.push({id:`v${v.chapter}-${j}-${i}`,w}))));
 return{nr:N.filter(x=>x.w[1]).map(x=>({id:x.id,q:x.w[0],a:x.w[1],say:x.w[1],x:x.w[2]})),nm:N.filter(x=>x.w[2]).map(x=>({id:x.id,q:x.w[0],a:x.w[2],say:x.w[1]||x.w[0],x:x.w[1]})),vr:V.filter(x=>x.w[1]).map(x=>({id:x.id,q:x.w[0],a:x.w[1],say:x.w[1],x:MM[x.w[0]]||''})),
 vm:V.filter(x=>MM[x.w[0]]).map(x=>({id:x.id,q:x.w[0],a:MM[x.w[0]],say:x.w[1]||x.w[0],x:x.w[1]})),
 g:DATA.gram.filter(g=>g[5]).map(g=>({id:'g'+g[0],q:g[3],a:g[5],say:g[3],x:g[4]||''})),
 k:DATA.kanji.map((k,i)=>({id:'k'+(i+1),q:k[0],a:'音 '+(k[1]||'-')+' / 訓 '+(k[2]||'-'),say:k[7]||k[0],x:k[5]+' '+k[6],h:k[1]||k[2]})).filter(d=>d.h),
 kw:DATA.kanji.map((k,i)=>({id:'k'+(i+1),q:k[5],a:k[6],say:k[7]||k[0],x:k[0],h:k[5]&&k[6]})).filter(d=>d.h)}}
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function pstart(){pr.list=shuf(decks()[pr.deck].filter(d=>!pr.fav||fav.has(d.id)));pr.i=0;pr.flip=false;pr.qz=null;
 if(pr.mode==='quiz'&&pr.list.length>=4){const n=Math.min(10,pr.list.length);pr.qz={qs:pr.list.slice(0,n).map(d=>{const o=shuf(pr.list.filter(x=>x.a!==d.a)).slice(0,3).map(x=>x.a);return{d,opts:shuf([d.a,...[...new Set(o)]])}}),n:0,score:0,pick:null,wrong:[]}}}
function pscreen(){if(!pr.list.length&&!pr.qz)pstart();
 $('#app').innerHTML=`<div class="top"><h1>練習 <small>カード・クイズ・音声</small></h1><div class="chips">${DK.map(d=>`<button class="chip ${pr.deck===d[0]?'on':''}" data-deck="${d[0]}">${d[1]}</button>`).join('')}</div>
 <div class="chips"><button class="chip ${pr.mode==='card'?'on':''}" data-mode="card">🃏 カード</button><button class="chip ${pr.mode==='quiz'?'on':''}" data-mode="quiz">❓ クイズ</button><button class="chip ${pr.fav?'on':''}" data-pfav>★ のみ</button><button class="chip" data-shuf>🔀 シャッフル</button></div></div><div class="body" id="pb"></div>`;pbody()}
function pbody(){const el=$('#pb');
 if(pr.mode==='quiz'){const z=pr.qz;
  if(!z){el.innerHTML='<div class="none">クイズには4問以上のデータが必要です<br>(★のみ・単語→ミャンマー語はデータが少ない場合があります)</div>';return}
  if(z.n>=z.qs.length){el.innerHTML=`<div class="qz"><div class="qq"><div class="big">結果: ${z.score} / ${z.qs.length}</div></div>${z.wrong.length?`<h2 class="gh">まちがえた問題</h2>${z.wrong.map(d=>`<div class="card" style="margin-bottom:8px"><b>${E(d.q)}</b> ${spk(d.say)}<div class="mm">${E(d.a)}</div></div>`).join('')}`:''}<div class="ctl"><button class="btn" data-shuf>もう一度</button></div></div>`;return}
  const q=z.qs[z.n];
  el.innerHTML=`<div class="qz"><div class="sub" style="text-align:center">${z.n+1} / ${z.qs.length}</div><div class="qq"><div class="fc" style="min-height:0;border:0;margin:0;padding:0;cursor:default"><div class="q">${E(q.d.q)}</div></div><button class="btn ghost" data-s="${A(q.d.say)}" style="margin-top:10px">🔊</button></div>
  ${q.opts.map((o,i)=>`<button class="opt ${z.pick===null?'':o===q.d.a?'ok':z.pick===i?'ng':''}" data-opt="${i}">${E(o)}</button>`).join('')}
  ${z.pick!==null?`<div class="ctl"><button class="btn" data-nq>${z.n+1>=z.qs.length?'結果を見る':'次へ'}</button></div>`:''}</div>`;return}
 const d=pr.list[pr.i];if(!d){el.innerHTML='<div class="none">データがありません<br>(★のみ/単語→ミャンマー語はデータが少ない場合があります)</div>';return}
 el.innerHTML=`<div class="sub" style="text-align:center">${pr.i+1} / ${pr.list.length}</div><div class="fc" data-flip>${pr.flip?`<div class="a">${E(d.a)}</div>${d.x?`<div class="sub" style="margin-top:10px">${E(d.x)}</div>`:''}`:`<div class="q">${E(d.q)}</div><div class="hint">タップして答えを見る</div>`}</div>
 <div class="ctl"><button class="btn ghost" data-pn="-1">◀</button><button class="btn ghost" data-s="${A(d.say)}">🔊</button><button class="btn ghost ${fav.has(d.id)?'on':''}" data-f="${d.id}">★</button><button class="btn" data-pn="1">▶</button></div>`}
document.addEventListener('click',e=>{const q=s=>e.target.closest(s);let b;
 if(b=q('[data-s]')){e.stopPropagation();return say(b.dataset.s)}
 if(b=q('[data-deck]')){pr.deck=b.dataset.deck;pstart();return pscreen()}
 if(b=q('[data-mode]')){pr.mode=b.dataset.mode;pstart();return pscreen()}
 if(q('[data-pfav]')){pr.fav=!pr.fav;pstart();return pscreen()}
 if(q('[data-shuf]')){pstart();return pscreen()}
 if(q('[data-flip]')){pr.flip=!pr.flip;return pbody()}
 if(b=q('[data-pn]')){const n=pr.list.length;pr.i=(pr.i+ +b.dataset.pn+n)%n;pr.flip=false;return pbody()}
 if(b=q('[data-opt]')){const z=pr.qz,s=z.qs[z.n];if(z.pick!==null)return;z.pick=+b.dataset.opt;if(s.opts[z.pick]===s.d.a)z.score++;else z.wrong.push(s.d);return pbody()}
 if(q('[data-nq]')){pr.qz.n++;pr.qz.pick=null;return pbody()}
 if(b=q('[data-go]'))return go(b.dataset.go);
 if(b=q('[data-f]')){const id=b.dataset.f;fav.has(id)?fav.delete(id):fav.add(id);save();if(st.tab==='practice'){pbody();return}if(st.fav)list();else b.classList.toggle('on');return}
 if(b=q('[data-chip]')){st.chip=b.dataset.chip;return screen()}
 if(q('[data-fav]')){st.fav=!st.fav;return screen()}
 if(q('[data-hide]')){st.hide=!st.hide;return screen()}
 if(b=q('[data-r]'))b.classList.toggle('show')});
go(location.hash.slice(1)||'home');
</script></body></html>
